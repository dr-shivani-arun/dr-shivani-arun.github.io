backend:
  name: git-gateway
  branch: main

media_folder: public/assets
public_folder: /assets

collections:
  - name: research
    label: Research
    folder: src/content/research
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Authors, name: authors, widget: list }
      - { label: Venue, name: venue, widget: string, required: false }
      - { label: Date, name: date, widget: datetime }
      - label: Category
        name: category
        widget: select
        options:
          - Oral-Systemic Link
          - Health Literacy
          - Epidemiology
          - IISc Projects
          - Community Health
      - { label: Tags, name: tags, widget: list }
      - { label: Abstract, name: abstract, widget: text }
      - label: Status
        name: status
        widget: select
        options:
          - Draft template
          - In progress
          - Preprint
          - Published
        default: Draft template
      - { label: DOI, name: doi, widget: string, required: false }
      - { label: PDF URL, name: pdfUrl, widget: string, required: false }
      - { label: Featured, name: featured, widget: boolean, default: false }
      - { label: Body, name: body, widget: markdown }

  - name: insights
    label: Insights
    folder: src/content/insights
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Published Date, name: publishedDate, widget: datetime }
      - label: Platform
        name: platform
        widget: select
        options:
          - LinkedIn
          - Instagram
          - Field note
          - Guide
      - label: Category
        name: category
        widget: select
        options:
          - Research Insights
          - Public Health Literacy
          - Community Outreach
          - Clinical Notes
      - { label: Excerpt, name: excerpt, widget: text }
      - { label: Tags, name: tags, widget: list }
      - { label: Original URL, name: originalUrl, widget: string, required: false }
      - { label: Featured Image, name: featuredImage, widget: string, required: false }
      - { label: Reading Time, name: readingTime, widget: string, default: 3 min read }
      - { label: Featured, name: featured, widget: boolean, default: false }
      - { label: Body, name: body, widget: markdown }
