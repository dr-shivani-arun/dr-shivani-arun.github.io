backend:
  name: git-gateway
  branch: main

media_folder: public/assets
public_folder: /assets

collections:
  - name: research
    label: Research / Projects
    folder: src/content/research
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Authors, name: authors, widget: list }
      - { label: Venue, name: venue, widget: string, required: false }
      - { label: Date, name: date, widget: datetime }
      - label: Category
        name: category
        widget: select
        options:
          - Oral-Systemic Link
          - Health Literacy
          - Epidemiology
          - IISc Project
          - MOOC Development
          - Community Health
      - { label: Abstract, name: abstract, widget: text, required: false }
      - { label: Paper URL, name: url, widget: string, required: false }
      - { label: PDF Link, name: pdf, widget: string, required: false }
