<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- subtle decorative ring -->
  <circle cx="300" cy="240" r="150" fill="none" stroke="#F8FAFC" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="300" cy="240" r="120" fill="none" stroke="#F8FAFC" stroke-opacity="0.08" stroke-width="1"/>

  <!-- head silhouette -->
  <circle cx="300" cy="200" r="95" fill="#F8FAFC" fill-opacity="0.18"/>
  <!-- shoulders -->
  <path d="M300 360c-110 0-170 60-190 150h380c-20-90-80-150-190-150z" fill="url(#shirt)"/>

  <!-- placeholder label -->
  <text x="300" y="560" text-anchor="middle" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" opacity="0.85">YOUR HEADSHOT HERE</text>
  <text x="300" y="588" text-anchor="middle" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" opacity="0.55">replace public/placeholders/hero-avatar-placeholder.svg</text>
</svg>