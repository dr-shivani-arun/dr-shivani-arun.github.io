<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- subtle grid pattern -->
  <g stroke="#F8FAFC" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>

  <!-- decorative circle -->
  <circle cx="640" cy="140" r="90" fill="none" stroke="#F8FAFC" stroke-opacity="0.10" stroke-width="2"/>
  <circle cx="640" cy="140" r="60" fill="none" stroke="#F8FAFC" stroke-opacity="0.08" stroke-width="1"/>

  <!-- label -->
  <text x="60" y="430" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700" opacity="0.9">RESEARCH COVER IMAGE</text>
  <text x="60" y="460" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400" opacity="0.6">replace public/placeholders/research-cover-placeholder.svg</text>
</svg>